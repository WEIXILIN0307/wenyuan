[project]
name = "wenyuan-api"
version = "0.1.0"
description = "Chinese writing workbench with revision-safe document transactions"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.138.0", "uvicorn==0.49.0", "httpx==0.28.1",
  "cryptography==50.0.0", "defusedxml==0.7.1", "markdown-it-py==4.0.0",
  "python-multipart==0.0.32", "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "ruff==0.15.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

